services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: cab, POSTGRES_USER: cab, POSTGRES_PASSWORD: cab }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cab"], interval: 5s, retries: 10 }

  kafka:                      # optional: docker compose --profile kafka up, with KAFKA_ENABLED=true
    image: apache/kafka:3.8.0
    profiles: [kafka]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  api:
    build: ./backend
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_healthy } }
    environment:
      DB_URL: jdbc:postgresql://db:5432/cab
      DB_USER: cab
      DB_PASSWORD: cab
      CACHE_TYPE: redis
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BOOTSTRAP: kafka:9092
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      REDIS_HOST: redis
      APP_PRODUCTION: ${APP_PRODUCTION:-false}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      STRIPE_SECRET: ${STRIPE_SECRET:-sk_test_replace_me}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_replace_me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      DISPATCH_RADIUS_KM: ${DISPATCH_RADIUS_KM:-8}
      REQUEST_EXPIRY_MINUTES: ${REQUEST_EXPIRY_MINUTES:-10}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    ports: ["8080:8080"]   # exposed so `stripe listen --forward-to localhost:8080/api/payments/webhook` works

  web:
    build:
      context: ./frontend
      args:
        VITE_STRIPE_PK: ${VITE_STRIPE_PK:-}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on: [api]
    ports: ["80:80"]

volumes: { pgdata: {} }
