server.port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cab}
    username: ${DB_USER:cab}
    password: ${DB_PASSWORD:cab}
  cache:
    type: ${CACHE_TYPE:simple}
    redis.time-to-live: 24h
  data.redis.host: ${REDIS_HOST:localhost}
  flyway:
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      properties:
        max.block.ms: 2000
    consumer:
      group-id: gulabi-audit
      auto-offset-reset: earliest
  jpa:
    hibernate.ddl-auto: ${DDL_AUTO:validate}
    open-in-view: false
app:
  jwt: { secret: "${JWT_SECRET:Y2hhbmdlLW1lLXRvLWEtbG9uZy1yYW5kb20tc2VjcmV0LWtleS0zMmJ5dGVz}", ttl-minutes: 120 }
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  dispatch-radius-km: ${DISPATCH_RADIUS_KM:8}
  request-expiry-minutes: ${REQUEST_EXPIRY_MINUTES:10}
  google-maps-key: ${GOOGLE_MAPS_API_KEY:}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  mail-from: ${MAIL_FROM:no-reply@gulabi.dev}
  production: ${APP_PRODUCTION:false}
  auth-rate-limit-per-minute: ${AUTH_RATE_LIMIT:10}
  public-url: ${PUBLIC_URL:http://localhost}
  kafka.enabled: ${KAFKA_ENABLED:false}
  admin-password: ${ADMIN_PASSWORD:change-me-now}
stripe:
  secret: ${STRIPE_SECRET:sk_test_replace_me}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_replace_me}
management.endpoints.web.exposure.include: health
management.health.redis.enabled: false
# Receipts are emailed only when a mail server is configured, e.g.:
# spring.mail.host / port / username / password via SPRING_MAIL_HOST, SPRING_MAIL_PORT, ...
